<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ey Panas — Contáctanos</title>
<meta name="description" content="Ey Panas: catálogo, WhatsApp, llamadas y redes sociales en un solo lugar.">
<meta name="theme-color" content="#3D0B12">
<link rel="icon" type="image/png" href="https://i.ibb.co/QFv5y5m6/favicon.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/QFv5y5m6/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo-fuego:#D6303D;
    --vinotinto:#6E1420;
    --vinotinto-deep:#3D0B12;
    --naranja-brasa:#F2793C;
    --mostaza:#FFC93C;
    --crema-pan:#FBE8C6;
    --tinta:#240D10;
    --verde-wa:#25D366;
    --font-display:'Bungee','Arial Narrow',Impact,sans-serif;
    --font-body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh; min-height:100dvh;
    font-family:var(--font-body);
    color:var(--tinta);
    background:
      radial-gradient(circle at 50% -10%, rgba(242,121,60,.35), transparent 55%),
      linear-gradient(180deg, var(--vinotinto) 0%, var(--vinotinto-deep) 60%);
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px calc(24px + env(safe-area-inset-bottom));
  }
  img,svg{ display:block; max-width:100%; }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; }
  a{ text-decoration:none; color:inherit; }

  .card{
    width:100%; max-width:400px;
    text-align:center;
  }
  .card__logo{
    width:min(58vw,220px); margin:0 auto 14px;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }
  .card__kicker{
    font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--mostaza); font-weight:600;
  }
  .card__title{
    font-family:var(--font-display);
    font-size:clamp(1.5rem,7vw,2.1rem);
    color:var(--crema-pan);
    margin:6px 0 4px;
    -webkit-text-stroke:1.2px var(--vinotinto-deep);
    paint-order:stroke fill;
  }
  .card__sub{
    font-size:.92rem; color:var(--crema-pan); opacity:.85;
    max-width:320px; margin:0 auto;
  }

  .card__actions{
    display:flex; flex-direction:column; gap:12px;
    margin-top:26px;
  }
  .cbtn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:54px;
    padding:13px 18px;
    border-radius:16px;
    font-family:var(--font-body); font-weight:700; font-size:.98rem;
    box-shadow:0 8px 18px rgba(0,0,0,.28);
    transition:transform .15s ease;
  }
  .cbtn:active{ transform:scale(.97); }
  .cbtn svg{ width:20px; height:20px; flex:none; }

  .cbtn--catalog{ background:var(--rojo-fuego); color:var(--crema-pan); }
  .cbtn--whatsapp{ background:var(--verde-wa); color:#fff; }
  .cbtn--call{ background:var(--mostaza); color:var(--vinotinto-deep); }
  .cbtn--save{
    background:rgba(251,232,198,.08);
    color:var(--crema-pan);
    border:1.5px solid rgba(251,232,198,.4);
    box-shadow:none;
  }

  .card__social{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:28px;
  }
  .card__social a{
    display:flex; align-items:center; justify-content:center;
    width:46px; height:46px;
    border-radius:50%;
    background:rgba(251,232,198,.1);
    border:1.5px solid rgba(251,232,198,.28);
    color:var(--crema-pan);
    transition:transform .15s ease, background .15s ease;
  }
  .card__social a:active{ transform:scale(.92); }
  .card__social svg{ width:20px; height:20px; }

  .card__foot{
    margin-top:26px;
    font-size:.7rem; color:rgba(251,232,198,.5);
  }

  .toast{
    position:fixed; left:50%; bottom:26px; z-index:20;
    transform:translate(-50%,12px);
    background:var(--vinotinto-deep); color:var(--crema-pan);
    padding:11px 18px; border-radius:999px;
    font-size:.84rem; font-weight:600;
    box-shadow:0 10px 22px rgba(0,0,0,.4);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:88vw;
  }
  .toast.is-shown{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

  <div class="card">
    <img class="card__logo" src="https://i.ibb.co/kVyZgBqM/Logotipo-ey-panas-letrasnalncas.png" alt="Ey Panas" loading="eager">
    <p class="card__kicker">Hamburguesas · Perros calientes · Pepitos</p>
    <h1 class="card__title">¡Ey Panas!</h1>
    <p class="card__sub">Tu antojo favorito, directo a tu puerta 🔥</p>

    <div class="card__actions">
      <a class="cbtn cbtn--catalog" href="http://eypanas.app" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 9h18M3 9v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9M3 9l2-5h14l2 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21v-6h6v6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Ver catálogo
      </a>
      <a class="cbtn cbtn--whatsapp" id="waBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.36 2 11.7c0 1.9.56 3.68 1.53 5.19L2 22l5.3-1.47A10.2 10.2 0 0 0 12 21.4c5.52 0 10-4.36 10-9.7S17.52 2 12 2Zm0 17.7c-1.6 0-3.1-.43-4.4-1.18l-.32-.18-3.14.87.86-3.05-.2-.32A7.9 7.9 0 0 1 3.8 11.7C3.8 7.36 7.5 3.8 12 3.8s8.2 3.56 8.2 7.9-3.7 8-8.2 8Zm4.5-5.92c-.24-.12-1.44-.7-1.66-.78-.22-.08-.38-.12-.55.12-.16.24-.63.78-.77.94-.14.16-.28.18-.52.06-.24-.12-1.02-.37-1.94-1.19-.72-.63-1.2-1.4-1.34-1.64-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.76-1.8-.2-.47-.4-.4-.55-.41h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg>
        Chatear por WhatsApp
      </a>
      <a class="cbtn cbtn--call" id="callBtn" href="#">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Llamar ahora
      </a>
      <button class="cbtn cbtn--save" id="saveBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s-7.5-4.87-10-9.5C.6 7.5 3 3.5 7 3.5c2 0 3.5 1 5 2.5 1.5-1.5 3-2.5 5-2.5 4 0 6.4 4 5 8-2.5 4.63-10 9.5-10 9.5Z" stroke="currentColor" stroke-width="0" fill="none"/><path d="M12 20v-8M8 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 8l1.6-4h12.8L20 8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Guardar contacto
      </button>
    </div>

    <div class="card__social">
      <!-- Reemplaza los href="#" por los enlaces reales de tus redes -->
      <a href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 8.5h2V5.2c-.35-.05-1.54-.15-2.94-.15-2.9 0-4.9 1.78-4.9 5.06v2.64H6.5v3.7h2.66V21h3.7v-4.55h2.55l.4-3.7h-2.95v-2.3c0-1.07.29-1.8 1.84-1.8Z" fill="currentColor"/></svg>
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 3v10.9a2.6 2.6 0 1 1-2-2.53" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3.6c.4 2.1 2.1 3.7 4.2 3.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <p class="card__foot">© <span id="yr"></span> Ey Panas · Hecho con 🔥</p>
  </div>

  <div class="toast" id="toast">Contacto guardado</div>

<script>
(function(){
  "use strict";

  // ======= EDITA AQUÍ tus datos =======
  var PHONE_E164   = "+584120543790";     // usado para WhatsApp y para llamar
  var WHATSAPP_MSG = "¡Hola! Vengo de la tarjeta de Ey Panas y quiero hacer un pedido 🍔";
  var CATALOG_URL  = "http://eypanas.app";
  // =====================================

  function byId(id){ return document.getElementById(id); }

  byId("yr").textContent = new Date().getFullYear();

  var waDigits = PHONE_E164.replace(/[^\d]/g, "");
  byId("waBtn").href = "https://wa.me/" + waDigits + "?text=" + encodeURIComponent(WHATSAPP_MSG);
  byId("callBtn").href = "tel:" + PHONE_E164;

  function showToast(msg){
    var t = byId("toast");
    t.textContent = msg;
    t.classList.add("is-shown");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("is-shown"); }, 2600);
  }

  byId("saveBtn").addEventListener("click", function(){
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:;Ey Panas;;;",
      "FN:Ey Panas",
      "ORG:Ey Panas",
      "TEL;TYPE=CELL,VOICE:" + PHONE_E164,
      "URL:" + CATALOG_URL,
      "NOTE:Hamburguesas\\, perros calientes y pepitos. Pide por WhatsApp o en el catálogo.",
      "END:VCARD"
    ];
    var blob = new Blob([lines.join("\r\n")], { type:"text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "EyPanas.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast("Contacto guardado ✅");
  });
})();
</script>
</body>
</html>
