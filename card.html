<!DOCTYPE html>
<!-- ey-panas-tarjeta-digital v1 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ey Panas — Tarjeta Digital</title>
<meta name="description" content="Tarjeta de presentación digital de Ey Panas: menú, WhatsApp, llamada directa y guardar contacto, todo en un solo toque.">
<meta name="theme-color" content="#D6303D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ey Panas">
<meta name="format-detection" content="telephone=no">

<link rel="icon" type="image/png" href="https://i.ibb.co/QFv5y5m6/favicon.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/QFv5y5m6/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<style>
  :root{
    --rojo-fuego:#D6303D;
    --rojo-brasa:#B8232E;
    --vinotinto:#6E1420;
    --vinotinto-deep:#3D0B12;
    --naranja-brasa:#F2793C;
    --mostaza:#FFC93C;
    --crema-pan:#FBE8C6;
    --tinta:#240D10;
    --verde-wa:#25D366;

    --font-display:'Bungee','Arial Narrow',Impact,sans-serif;
    --font-body:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body{
    background:var(--vinotinto-deep);
    font-family:var(--font-body);
    color:var(--tinta);
    position:relative;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  h1,p{ margin:0; }
  img,svg{ display:block; max-width:100%; }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; touch-action:manipulation; }
  a{ touch-action:manipulation; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------- animated background (mismo sistema que el catálogo) ---------- */
  .bg{ position:fixed; inset:0; z-index:0; overflow:hidden; }
  .bg__wash{
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 24% 12%, var(--rojo-brasa) 0%, var(--rojo-fuego) 42%, var(--vinotinto-deep) 100%);
  }
  .bg__blob{ position:absolute; width:52vmax; height:52vmax; border-radius:50%; filter:blur(70px); opacity:.5; will-change:transform; }
  .bg__blob--1{ top:-18%; left:-14%; background:radial-gradient(circle, var(--mostaza), transparent 68%); mix-blend-mode:overlay; animation:driftA 26s ease-in-out infinite; }
  .bg__blob--2{ bottom:-22%; right:-16%; background:radial-gradient(circle, var(--naranja-brasa), transparent 68%); mix-blend-mode:overlay; animation:driftB 32s ease-in-out infinite; }
  .bg__blob--3{ bottom:8%; left:12%; width:38vmax; height:38vmax; background:radial-gradient(circle, var(--vinotinto), transparent 70%); opacity:.45; mix-blend-mode:multiply; animation:driftC 38s ease-in-out infinite; }
  @keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(6vmax,5vmax) scale(1.12); } }
  @keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-5vmax,-6vmax) scale(1.15); } }
  @keyframes driftC{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(4vmax,-4vmax) scale(1.08); } }

  .bg__mosaic-wrap{ position:absolute; inset:-15%; opacity:.13; mix-blend-mode:soft-light; animation:mosaicDrift 60s linear infinite; }
  .bg__mosaic{ width:100%; height:100%; display:block; }
  @keyframes mosaicDrift{ from{ transform:translate(0,0); } to{ transform:translate(-260px,-260px); } }

  .bg__grain{ position:absolute; inset:0; background-image:radial-gradient(rgba(0,0,0,.5) 1px, transparent 1px); background-size:3px 3px; opacity:.05; mix-blend-mode:overlay; }
  .bg__vignette{ position:absolute; inset:0; background:radial-gradient(90% 80% at 50% 0%, transparent 55%, rgba(20,4,7,.5) 100%); }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---------- tarjeta (una sola pantalla, sin scroll) ---------- */
  .page{
    position:relative; z-index:1;
    height:100vh; height:100dvh;
    max-width:440px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:
      max(18px, env(safe-area-inset-top))
      max(22px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(22px, env(safe-area-inset-left));
    overflow:hidden;
  }

  .card-kicker{
    flex:none;
    text-align:center;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--mostaza); font-weight:600;
  }

  .logo-wrap{
    flex:none; position:relative;
    display:flex; justify-content:center; align-items:center;
    margin-top:clamp(8px,2dvh,16px);
  }
  .logo-wrap::before{
    content:"";
    position:absolute; top:50%; left:50%;
    width:clamp(130px,40dvh,220px); height:clamp(130px,40dvh,220px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,201,60,.32), transparent 70%);
    filter:blur(4px);
    pointer-events:none;
  }
  .logo{
    position:relative;
    height:clamp(56px,12dvh,100px); width:auto; max-width:80%;
    object-fit:contain;
    filter:drop-shadow(0 8px 16px rgba(20,4,7,.4));
  }

  .card-tagline{
    flex:none; text-align:center;
    color:var(--crema-pan); opacity:.88;
    font-size:clamp(.8rem,3.1vw,.94rem); line-height:1.35;
    margin-top:clamp(6px,1.6dvh,12px);
    padding:0 6px;
  }

  /* ---------- botones de acción (acordes y autoajustados) ---------- */
  .actions{
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    gap:clamp(9px,2dvh,14px);
    margin-top:clamp(14px,3dvh,20px);
  }
  .actions > .cta,
  .actions > .cta-row{ flex:1; min-height:0; }
  .cta-row{ display:flex; gap:clamp(9px,2dvh,14px); }
  .cta-row > .cta{ flex:1; min-height:0; }

  .cta{
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:10px;
    width:100%; height:100%;
    padding:0 16px;
    border-radius:999px;
    font-family:var(--font-body); font-weight:700;
    color:var(--crema-pan);
    text-decoration:none;
    transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }
  .cta:active{ transform:scale(.96); }
  .cta:focus-visible{ outline:2.5px solid var(--mostaza); outline-offset:3px; }
  .cta__icon{ flex:none; display:inline-flex; }
  .cta__icon svg{ width:clamp(20px,5.4vw,26px); height:clamp(20px,5.4vw,26px); }
  .cta__label{ font-size:clamp(.88rem,3.6vw,1.05rem); white-space:nowrap; }

  .cta--menu{ background:var(--rojo-fuego); box-shadow:0 10px 20px rgba(20,4,7,.35); }
  .cta--whatsapp{ background:var(--verde-wa); color:#fff; box-shadow:0 10px 20px rgba(20,4,7,.35); }

  .cta-row .cta{ flex-direction:column; gap:6px; border-radius:22px; padding:8px 8px; }
  .cta-row .cta__label{ font-size:clamp(.76rem,3.2vw,.88rem); }
  .cta-row .cta__icon svg{ width:clamp(19px,5vw,23px); height:clamp(19px,5vw,23px); }

  .cta--call{ background:var(--mostaza); color:var(--vinotinto); box-shadow:0 8px 16px rgba(20,4,7,.3); }
  .cta--save{ background:rgba(251,232,198,.12); border:1.5px solid rgba(251,232,198,.32); }
  .cta--save.is-saved{ background:var(--mostaza); border-color:var(--mostaza); color:var(--vinotinto); }

  /* ---------- pie de página (idéntico al catálogo) ---------- */
  .card-footer{ flex:none; margin-top:clamp(10px,2.2dvh,16px); }
  .catalog-footer{
    text-align:center; color:var(--crema-pan); opacity:.75;
    font-size:clamp(.65rem,2.6vw,.76rem);
  }
  .catalog-footer + .catalog-footer{ margin-top:4px; }
  .catalog-footer a{ color:var(--mostaza); text-decoration:underline; }

  .social-row{ display:flex; justify-content:center; gap:12px; margin-top:clamp(8px,1.8dvh,12px); }
  .social-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:clamp(34px,8vw,42px); height:clamp(34px,8vw,42px);
    border-radius:50%;
    border:1.5px solid rgba(251,232,198,.28);
    color:var(--crema-pan);
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  }
  .social-btn svg{ width:clamp(16px,4vw,19px); height:clamp(16px,4vw,19px); }
  .social-btn:hover{ background:var(--rojo-fuego); border-color:var(--rojo-fuego); color:#fff; }
  .social-btn:active{ transform:scale(.94); }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:max(18px, env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    max-width:88vw;
    background:var(--vinotinto); color:var(--crema-pan);
    font-weight:600; font-size:.85rem;
    padding:10px 18px; border-radius:999px;
    box-shadow:0 10px 22px rgba(0,0,0,.35);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.is-shown{ opacity:1; transform:translate(-50%,0); }

  /* ---------- ajuste para pantallas muy bajas ---------- */
  @media (max-height:600px){
    .card-kicker{ display:none; }
    .card-tagline{ display:none; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true">

  <main class="page">
    <h1 class="sr-only">Ey Panas — Tarjeta de presentación digital</h1>

    <p class="card-kicker">Tarjeta digital</p>

        <span class="cta__icon" aria-hidden="true">

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function(){
    "use strict";

    var saveBtn = document.getElementById("saveContactBtn");
    var toastEl = document.getElementById("toast");
    var toastTimer = null;

    function showToast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("is-shown");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toastEl.classList.remove("is-shown"); }, 2200);
    }

    saveBtn.addEventListener("click", function(){
      var vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:;Ey Panas;;;",
        "FN:Ey Panas",
        "ORG:Ey Panas",
        "TITLE:Encargado de Negocios",
        "TEL;TYPE=WORK,VOICE:+58 412-054-3790",
        "URL:http://eypanas.app",
        "NOTE:Pide tu menú o escríbenos por WhatsApp.",
        "END:VCARD"
      ].join("\r\n");

      try{
        var blob = new Blob([vcard], { type:"text/vcard;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "EyPanas.vcf";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);

        saveBtn.classList.add("is-saved");
        setTimeout(function(){ saveBtn.classList.remove("is-saved"); }, 1400);
        showToast("¡Contacto guardado!");
      }catch(err){
        showToast("No se pudo guardar. Guarda el número manualmente.");
      }
    });
  })();
  </script>
